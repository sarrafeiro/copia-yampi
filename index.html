<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#111827">
    <title>Finalizar compra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/checkout.css">
  </head>
  <body>
    <div class="demo-bar" id="demoBar" hidden>
      Ambiente de demonstração: nenhum pagamento é cobrado.
      <button type="button" class="link" data-action="restart">Recomeçar</button>
    </div>

    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" id="brand" href="#"></a>
        <p class="secure">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <span class="secure__text"><strong>Pagamento</strong><span>100% seguro</span></span>
        </p>
      </div>
    </header>
    <div class="trustbar" id="trustbar"></div>

    <!-- Desktop: três colunas independentes. Mobile: as colunas somem (display: contents) e vira uma pilha só. -->
    <main class="layout" id="checkout">
      <div class="col col--steps">
        <section class="card step" id="step-1" aria-label="Identificação"></section>
        <section class="card step" id="step-2" aria-label="Entrega"></section>
      </div>
      <div class="col col--payment">
        <section class="card step" id="step-3" aria-label="Pagamento"></section>
      </div>
      <div class="col col--side">
        <aside class="card summary" id="summary" aria-label="Resumo do pedido"></aside>
        <section class="reviews" id="reviews" aria-label="Avaliações de clientes"></section>
      </div>
    </main>

    <main class="thanks" id="thanks" hidden></main>

    <footer class="footer" id="footer"></footer>

    <div class="modal" id="modal" hidden>
      <div class="modal__backdrop" data-action="modal-close"></div>
      <div class="modal__dialog" role="dialog" aria-modal="true">
        <button type="button" class="modal__close" data-action="modal-close" aria-label="Fechar">&times;</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <div class="processing" id="processing" role="status" hidden>
      <span class="spinner spinner--lg"></span>
      <p>Processando…</p>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript><p style="padding:24px;text-align:center">Ative o JavaScript para finalizar a compra.</p></noscript>

    <script src="js/config.js"></script>
    <script src="js/checkout.js"></script>
  </body>
</html>
